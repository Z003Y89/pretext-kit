<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>pretext-kit sweep</title>
<style>
  /* Every property Pretext models is pinned here or set per case, so the probe paints only what was measured. */
  body { margin: 0; }
  #probe, #clamp, #line {
    position: absolute;
    top: 0;
    left: 0;
    margin: 0;
    padding: 0;
    border: 0;
    font-style: normal;
    font-variant: normal;
    font-weight: 400;
    font-stretch: normal;
    letter-spacing: normal;
    word-spacing: normal;
    white-space: normal;
    overflow-wrap: break-word;
    word-break: normal;
    line-break: auto;
    hyphens: manual;
    text-align: start;
    -webkit-text-size-adjust: none;
    text-size-adjust: none;
  }
  /* A CSS line clamp: -webkit-line-clamp is set per case. */
  #clamp {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  /* One line exactly as given: no wrapping, no collapsing, width from its own box. */
  #line {
    white-space: pre;
  }
</style>
</head>
<body>
<div id="probe"></div>
<div id="clamp"></div>
<span id="line"></span>
<script src="dist/sweep.js"></script>
</body>
</html>
