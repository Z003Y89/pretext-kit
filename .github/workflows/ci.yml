# CI for pretext-kit. Every job lays the repositories out as verify/reproduce.sh does: this repository in pretext-kit/
# and chenglou/pretext at the pinned commit in pretext/ beside it (the kit's devDependency is file:../pretext), with
# Pretext built by its pinned TypeScript (its own `npm install` no longer resolves; see README, Install).
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  PRETEXT_COMMIT: f10d888c0f3dfc5877fbca5e4570ee04111e7001

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: pretext-kit
    steps:
      - uses: actions/checkout@v7
        with:
          path: pretext-kit
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: chenglou/pretext
          ref: ${{ env.PRETEXT_COMMIT }}
          path: pretext
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Build Pretext (pinned tsc)
        working-directory: pretext
        run: npx -y -p typescript@6.0.2 tsc -p tsconfig.build.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run check

  # Headless parity (verify/HEADLESS_RESULTS.md) and the label checker sweep (verify/CHECK_RESULTS.md) off macOS. A
  # headless-mismatch or check-mismatch here is the measurement, not a CI failure: the sweep steps may fail without
  # failing the workflow, and their results are uploaded either way.
  parity:
    name: parity (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
        working-directory: pretext-kit
    steps:
      - uses: actions/checkout@v7
        with:
          path: pretext-kit
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: chenglou/pretext
          ref: ${{ env.PRETEXT_COMMIT }}
          path: pretext
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build Pretext (pinned tsc)
        working-directory: pretext
        run: npx -y -p typescript@6.0.2 tsc -p tsconfig.build.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      # The checkout holds the committed macOS results; removed so a run that crashes uploads nothing stale.
      - run: rm -f verify/HEADLESS_RESULTS.md
      # Headed, as on macOS: Linux has no display, so the headed Chromium runs under a virtual X server.
      - name: verify:headless (Linux, headed under xvfb)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: xvfb-run -a npm run verify:headless 2>&1 | tee verify/headless-run.log
      - name: verify:headless (Windows, headed)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: npm run verify:headless 2>&1 | tee verify/headless-run.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: headless-results-${{ matrix.os }}
          path: |
            pretext-kit/verify/HEADLESS_RESULTS.md
            pretext-kit/verify/headless-run.log
          if-no-files-found: warn
      # The label checker's oracle sweep (verify/CHECK_RESULTS.md), recorded the same way: a check-mismatch here is the
      # measurement, not a CI failure.
      - run: rm -f verify/CHECK_RESULTS.md
      - name: verify:check (Linux, headed under xvfb)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: xvfb-run -a npm run verify:check 2>&1 | tee verify/check-run.log
      - name: verify:check (Windows, headed)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: npm run verify:check 2>&1 | tee verify/check-run.log
      # What this Chromium measures at fractional font sizes against the stand-in's profiles (a diagnostic; the job log
      # holds its summary).
      - name: verify:fractional (Linux, headed under xvfb)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: xvfb-run -a npm run verify:fractional 2>&1 | tee verify/fractional-run.log
      - name: verify:fractional (Windows, headed)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: npm run verify:fractional 2>&1 | tee verify/fractional-run.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: check-results-${{ matrix.os }}
          path: |
            pretext-kit/verify/CHECK_RESULTS.md
            pretext-kit/verify/check-run.log
            pretext-kit/verify/dist/check-cases.md
            pretext-kit/verify/fractional-run.log
            pretext-kit/verify/dist/fractional.jsonl
          if-no-files-found: warn

  # The release tarballs, packed as verify/pack-release.sh packs them for a release, installed into a fresh project.
  consumer-smoke:
    name: consumer smoke (ubuntu-latest, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: pretext-kit
    steps:
      - uses: actions/checkout@v7
        with:
          path: pretext-kit
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: chenglou/pretext
          ref: ${{ env.PRETEXT_COMMIT }}
          path: pretext
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Build Pretext (pinned tsc)
        working-directory: pretext
        run: npx -y -p typescript@6.0.2 tsc -p tsconfig.build.json
      - run: npm ci --no-audit --no-fund
      - name: Pack both tarballs
        run: bash verify/pack-release.sh --pretext=../pretext
      - name: Install them into a fresh project and run the smoke script
        run: node verify/consumer-smoke.mjs dist-release/chenglou-pretext-0.0.10-main.f10d888.tgz dist-release/pretext-kit-*.tgz
      - uses: actions/upload-artifact@v7
        if: matrix.node == 24
        with:
          name: release-tarballs
          path: |
            pretext-kit/dist-release/*.tgz
            pretext-kit/dist-release/*.sbom.cdx.json
